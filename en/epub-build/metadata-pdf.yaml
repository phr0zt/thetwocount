description: Every system ever built to make someone else surrender their ego works by the same two-variable mechanism -- and every one of those systems, without exception, exempts exactly one belief from it. Drawing on Phil Jackson's triangle offense, Karl Friston's free energy principle, and Ray Dalio's believability-weighted decision-making, this book builds a diagnostic framework for telling healing ego-dissolution from harmful ego-dissolution, then turns it on its own subjects -- and on the reader.
