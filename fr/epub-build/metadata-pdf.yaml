---
pagetitle: Le Compte de Deux
author: Généré à partir des travaux publics de Phil Jackson, Karl Friston et Ray Dalio
lang: fr-FR
date: Août 2026
description: Tout système jamais conçu pour forcer quelqu'un d'autre à abandonner son ego fonctionne selon le même mécanisme à deux variables — et chacun de ces systèmes, sans exception, exempte une seule croyance de ce mécanisme. En s'appuyant sur l'attaque en triangle de Phil Jackson, le principe d'énergie libre de Karl Friston et la pondération de crédibilité de Ray Dalio, ce livre construit un cadre diagnostique permettant de distinguer une dissolution de l'ego qui guérit d'une dissolution de l'ego qui blesse, puis retourne ce cadre contre ses propres sujets, et contre le lecteur.
---
